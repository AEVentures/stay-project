<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12182e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Stay Project — Open-source suicide prevention, free for everyone</title>
    <meta
      name="description"
      content="The Stay Project is an open-source project building free, public suicide-prevention resources and tools. If you or someone you know is struggling, call or text 988 (US) any time."
    />
    <link rel="canonical" href="https://aeventures.github.io/stay-project/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stay Project" />
    <meta property="og:title" content="Stay Project — Open-source suicide prevention, free for everyone" />
    <meta
      property="og:description"
      content="An open-source, public-benefit project building free suicide-prevention resources and tools. Free. Open. For everyone."
    />
    <meta property="og:url" content="https://aeventures.github.io/stay-project/" />
    <meta property="og:image" content="https://aeventures.github.io/stay-project/assets/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stay Project — Open-source suicide prevention" />
    <meta
      name="twitter:description"
      content="Open-source suicide-prevention resources and tools, free for everyone."
    />
    <meta name="twitter:image" content="https://aeventures.github.io/stay-project/assets/og.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Stay Project",
        "url": "https://aeventures.github.io/stay-project/",
        "description": "Open-source infrastructure for suicide prevention, free for everyone.",
        "sameAs": ["https://github.com/AEVentures/stay-project"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
